// SPDX-License-Identifier: Apache-2.0
//
// Kams extensions to the published OpenTelemetry MCP semantic conventions.
//
// The standard MCP model already defines span naming, mcp.method.name,
// mcp.protocol.version, mcp.session.id, gen_ai.tool.name, jsonrpc.request.id,
// network.transport, error.type, propagation through params._meta, and
// mcp.client.operation.duration. Kams implements those definitions directly.
//
// This file intentionally proposes only the remaining gap: attribution of
// model-context cost to the MCP dependency whose result caused it.

groups:
  - id: registry.kams.mcp_context
    type: attribute_group
    display_name: Kams MCP Context-Cost Attributes
    brief: Experimental attribution of model-context cost to MCP results.
    attributes:
      - id: mcp.context.cost.tokens
        type: int
        stability: development
        brief: Model-context tokens consumed by this MCP operation's result.
        note: >
          Tool results enter later model requests, but provider usage is
          reported at the inference turn rather than per result. An
          instrumentation library may estimate this value from result size,
          then reconcile it when the provider-reported input-token delta
          arrives.

      - id: mcp.context.cost.estimated
        type: boolean
        stability: development
        brief: Whether mcp.context.cost.tokens is estimated rather than measured.
        note: >
          Required whenever mcp.context.cost.tokens is present. Consumers must
          not mix estimated and provider-reconciled values silently.

  - id: metric.kams.mcp.context.cost.tokens
    type: metric
    metric_name: mcp.context.cost.tokens
    stability: development
    instrument: histogram
    unit: "{token}"
    brief: Context tokens attributed to MCP tool results.
    attributes:
      - ref: gen_ai.tool.name
        requirement_level: recommended
      - ref: mcp.context.cost.estimated
        requirement_level: required
